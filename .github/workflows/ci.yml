name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Playwright's image ships the browsers and every library they need, so the job never runs apt (GitHub's Ubuntu
    # mirror has stalled installs for an hour). Keep the tag in step with @playwright/test in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 75
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      # The container runs as root on a checkout owned by the runner user.
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm packages
        run: npm ci

      - name: Restore .NET tools (Fable, for the F# islands)
        run: dotnet tool restore

      - name: Build (runtime, samples, codegen, island bundles)
        run: npm run build

      - name: Generated TypeScript is up to date
        run: git diff --exit-code -- samples/IslandsSample/islands-src/generated/types.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest, C#, F#)
        run: npm test

      - name: Pack
        run: dotnet pack -c Release -o artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg

      - name: End-to-end tests and compatibility matrix
        run: npm run e2e
        env:
          # The browsers baked into the image.
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/matrix-report.md
            tests/e2e/test-results
          if-no-files-found: ignore
