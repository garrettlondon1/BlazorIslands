name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm packages
        run: npm ci

      - name: Restore .NET tools (Fable, for the F# islands)
        run: dotnet tool restore

      - name: Build (runtime, samples, codegen, island bundles)
        run: npm run build

      - name: Generated TypeScript is up to date
        run: git diff --exit-code -- samples/IslandsSample/islands-src/generated/types.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest, C#, F#)
        run: npm test

      - name: Pack
        run: dotnet pack -c Release -o artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: tests/e2e

      - name: End-to-end tests and compatibility matrix
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/matrix-report.md
            tests/e2e/test-results
          if-no-files-found: ignore
